name: Collector
description: >
  The Dart SDK and the collector's dependencies, the start of every
  workflow that runs the collector (after actions/checkout).

runs:
  using: composite
  steps:
    - name: Read the pinned Dart version
      id: dart
      shell: bash
      run: echo "version=$(cat .dart-version)" >> "$GITHUB_OUTPUT"

    - uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ steps.dart.outputs.version }}
        # Its matcher file is looked up in this action's folder when
        # called from a composite action, which fails setup. Disabling
        # it does not change the analyzer's nonzero exit on diagnostics.
        problem-matcher: false

    - name: Install collector dependencies
      shell: bash
      run: cd collector && dart pub get --enforce-lockfile
