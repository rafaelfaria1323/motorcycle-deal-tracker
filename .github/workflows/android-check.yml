name: Android build

# Pull requests that change what the Android app is built from (its
# plugins, the dependencies, the build script): the APK built as the
# deploy builds it, but not signed with the app's key nor published, so a
# broken Android build shows before the merge rather than in the deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/packages/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'tool/android_build.sh'
      - 'tool/android_manifest.py'
      - 'tool/firebase_values.py'
      - 'tool/android_cache_keys.sh'
      - '.github/workflows/android-check.yml'

concurrency:
  group: android-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The deploy's Gradle and NDK caches (deploy-web.yml), read only: a
      # pull request saves none of its own.
      - name: Android cache keys
        id: android
        run: tool/android_cache_keys.sh >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: android-gradle-${{ steps.android.outputs.flutter }}-${{ hashFiles('app/pubspec.lock', 'app/packages/**', 'tool/android_build.sh', 'tool/android_manifest.py', 'tool/firebase_values.py') }}
          restore-keys: android-gradle-

      - uses: actions/cache/restore@v6
        if: steps.android.outputs.ndk != ''
        with:
          path: ${{ steps.android.outputs.ndk_path }}
          key: android-ndk-${{ steps.android.outputs.ndk }}

      - name: Build APK
        env:
          # Made-up Firebase settings: the build with notifications is
          # checked without the real project.
          FIREBASE_ANDROID_CONFIG: >-
            {"project_info": {"project_number": "1", "project_id": "check"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:1:android:1",
            "android_client_info": {"package_name":
            "io.github.rafaelfaria1323.motorcycle_deal_tracker"}},
            "api_key": [{"current_key": "check"}]}]}
        run: tool/android_build.sh 1
