name: Android build

# Pull requests that change what the Android app is built from (its
# plugins, the dependencies, the build script): the APK built as the
# deploy builds it, but not signed with the app's key nor published, so a
# broken Android build shows before the merge rather than in the deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/packages/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'tool/android_build.sh'
      - 'tool/android_manifest.py'
      - 'tool/firebase_values.py'
      - '.github/workflows/android-check.yml'

concurrency:
  group: android-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        env:
          # Made-up Firebase settings: the build with notifications is
          # checked without the real project.
          FIREBASE_ANDROID_CONFIG: >-
            {"project_info": {"project_number": "1", "project_id": "check"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:1:android:1",
            "android_client_info": {"package_name":
            "io.github.rafaelfaria1323.motorcycle_deal_tracker"}},
            "api_key": [{"current_key": "check"}]}]}
        run: tool/android_build.sh 1
