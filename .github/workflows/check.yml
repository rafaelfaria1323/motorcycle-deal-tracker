name: Check

# Every pull request to main: the same checks as `make check` (app analyze
# and tests with Flutter; collector format, analyze and tests),
# `make app-smoke` (offline Chrome flow), and `make db-test`
# (migrations and SQL tests on Postgres), so a change is
# proven before it is merged rather than when the deploy runs.
# The jobs run side by side: the app's checks, its tests in shards, the
# smoke, the collector's tests in shards and the collector/database
# checks (the collector's jobs use the workflows' shared collector
# setup). Each suite runs once, split by file over as many shards as
# its tests need (the job `plan`, tool/test_shard.py: from the last
# run's times of each file), each shard with coverage. The job `check`
# waits for them, takes each suite's coverage floor over its shards'
# lcov files merged, keeps this run's times for the next plan (artifact
# `test-times`), and is the one result the PR shows as "check".
# PRs opened by a workflow (code quality, test hardening) don't trigger
# pull_request runs (GitHub's rule for GITHUB_TOKEN), so backlog-pass.yml
# starts this by workflow_dispatch on the PR's branch; the result is
# attached to the same commit, so it shows on the PR.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces a check still running.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # How many shards each suite's tests get and which files each runs
  # (tool/test_shard.py plan): about TARGET_SECONDS of tests each, at
  # most MAX_SHARDS, every file weighed by what it took in the newest
  # run that kept its times (artifact `test-times`, this repository's
  # runs only, never a fork's); without one, by its size. So the shards
  # grow with the tests and stay even.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
      collector: ${{ steps.plan.outputs.collector }}
    steps:
      - uses: actions/checkout@v7

      # Best effort: no artifact (the first run, or expired) or a failed
      # download leaves no file, and the plan uses the files' sizes.
      - name: The last run's test times
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=test-times&per_page=30" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)][0].id // empty" || true)
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/times.zip"; then
            unzip -p "$RUNNER_TEMP/times.zip" test-times.json > times.json || rm -f times.json
          fi
          if [ -f times.json ]; then echo "Times from artifact $id"; else echo "No times: split by size"; fi

      - id: plan
        run: |
          app=$(python3 tool/test_shard.py plan app times.json)
          collector=$(python3 tool/test_shard.py plan collector times.json)
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "collector=$collector" >> "$GITHUB_OUTPUT"
          echo "App: $app"
          echo "Collector: $collector"

  # The app: analyze and unused code (its tests: app-test).
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: cd app && flutter pub get --enforce-lockfile

      - name: make app-analyze
        run: make app-analyze

      # Unused code and unused files in the app (dart_code_linter).
      - name: make dead-code
        run: |
          dart pub global activate dart_code_linter 4.4.2 >/dev/null
          make dead-code

  # The app's tests in one job per shard (as many and with the files
  # `plan` says), each with coverage; the floor is taken over all of
  # them in `check`.
  app-test:
    name: app-test (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.app) }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: cd app && flutter pub get --enforce-lockfile

      - name: make app-test-coverage (this shard's files)
        env:
          TEST_FILES: ${{ matrix.files }}
        run: make app-test-coverage

      # The lcov for the floor, the JSON report for the next plan.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-app-${{ matrix.shard }}
          path: |
            app/coverage/lcov.info
            app/coverage/tests.jsonl
          retention-days: 1
          if-no-files-found: error

  # The offline Chrome flow (ChromeDriver is on the runner image).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: make app-smoke
        run: make app-smoke

  # The collector's tests in one job per shard (as many and with the
  # files `plan` says), each with coverage; the floor is taken over all
  # of them in `check`.
  collector-test:
    name: collector-test (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.collector) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/collector

      - name: make collector-test-coverage (this shard's files)
        env:
          TEST_FILES: ${{ matrix.files }}
        run: |
          dart pub global activate coverage >/dev/null
          make collector-test-coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-collector-${{ matrix.shard }}
          path: |
            collector/coverage/lcov.info
            collector/coverage/tests.jsonl
          retention-days: 1
          if-no-files-found: error

  # Everything else without Flutter's app: migrations, workflows and
  # scripts, the collector's format and analysis, tool/, copy-paste and
  # the database.
  collector-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Plain Postgres for `make db-test`: every migration applied to an
    # empty database, then the SQL tests in supabase/tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Merging applies new migrations to Supabase (deploy-web.yml), so
      # catch here what would fail there: a change to a migration already
      # on main, or a new one that doesn't sort after them.
      - name: Check migrations against main
        run: tool/check_migrations.sh "$(git merge-base origin/main HEAD)" HEAD

      # Workflows and shell scripts: actionlint (expressions, inputs,
      # secrets, and shellcheck on every run: step) and shellcheck on
      # tool/*.sh. A typo there would otherwise show only when the
      # workflow runs. shellcheck is on the runner image.
      - name: make lint-scripts
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP:$PATH" make lint-scripts

      # The production setup, using Flutter's matching Dart SDK without
      # downloading Flutter for a job that only runs Dart.
      - uses: ./.github/actions/collector

      - name: The collector starts
        run: |
          cd collector
          set +e
          dart run bin/report_run.dart
          code=$?
          set -e
          [ "$code" = 64 ] || { echo "Expected exit 64, got $code"; exit 1; }

      - name: make collector-lint
        run: make collector-lint

      # The photo model's tests need its dependencies (and onnx, to build
      # tiny models); without them they would be skipped.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/photo_requirements.txt

      - name: make tool-check
        run: |
          python -m pip install --quiet -r tool/photo_requirements.txt onnx==1.23.2
          make tool-check PYTHON=python

      # Copy-pasted code above 1 % of the lines fails (jscpd).
      - name: make duplication
        run: make duplication

      # make sql-lint runs make db-test first, then checks the database it
      # leaves (plpgsql_check, splinter) and squawk on this PR's new
      # migrations. plpgsql_check goes into the Postgres container (the
      # official image has the PostgreSQL apt repository). The server's
      # package is held: a newer plpgsql_check build can require a newer
      # minor release, whose plpgsql.so the running server can't load
      # ("undefined symbol"), and a restarted, upgraded server dumps a
      # different schema.sql. So the newest build that fits the server
      # is installed (apt-cache madison lists newest first).
      - name: make sql-lint (with make db-test)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" sh -c '
            apt-get update -qq && apt-mark hold postgresql-16 >/dev/null
            for v in $(apt-cache madison postgresql-16-plpgsql-check | cut -d"|" -f2); do
              apt-get install -y -qq "postgresql-16-plpgsql-check=$v" >/dev/null 2>&1 \
                && { echo "plpgsql_check $v"; exit 0; }
            done
            echo "No plpgsql_check build fits the server"; exit 1'
          pipx install squawk-cli==2.70.0 >/dev/null
          make sql-lint

  # The single result named "check", as before the split: green only when
  # every job passed (also when one was cancelled or skipped) and each
  # suite's coverage, over all its shards, is above its floor.
  check:
    needs: [plan, app, app-test, smoke, collector-test, collector-db]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

      # The floors need the Makefile and tool/lcov_summary.py.
      - uses: actions/checkout@v7

      # One folder per shard: coverage/coverage-app-0/lcov.info, ...
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Coverage floors (every shard's lcov, merged)
        run: |
          make app-coverage-floor APP_LCOV="coverage/coverage-app-*/lcov.info"
          make collector-coverage-floor COLLECTOR_LCOV="coverage/coverage-collector-*/lcov.info"

      # Each file's time in this run, for the next run's plan.
      - name: This run's test times
        run: |
          python3 tool/test_shard.py times coverage > test-times.json
          cat test-times.json

      - uses: actions/upload-artifact@v7
        with:
          name: test-times
          path: test-times.json
          retention-days: 30
          if-no-files-found: error
