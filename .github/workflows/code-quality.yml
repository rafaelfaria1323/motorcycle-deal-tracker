name: Code quality review

# After every 5 merged PRs (or "Run workflow"), Claude works on
# docs/code-quality.md through backlog-pass.yml: while "To do" has items it
# does up to 3 per run; when "To do" is empty the run only finds new items
# (up to 10) and changes no code. One PR labelled "code-quality" per run
# (none if nothing is worth it); no run starts while one is still open.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret and "Allow GitHub Actions to
# create and approve pull requests" in the repo settings.
on:
  workflow_dispatch: # manual "Run workflow" button: run now
  pull_request:
    types: [closed]
    branches: [main]

# One backlog pass at a time (code quality and test hardening).
concurrency:
  group: backlog-pass
  cancel-in-progress: false

jobs:
  pass:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    uses: ./.github/workflows/backlog-pass.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      backlog: docs/code-quality.md
      label: code-quality
      tag: code-quality-reviewed
      count_from: '2026-10-19T00:00:00Z'
      manual: ${{ github.event_name == 'workflow_dispatch' }}
      find_prompt: |
        Review the code for these, in this order: bugs you can prove with
        a test; duplicated code; dead code; missing tests for pure logic
        (*_text.dart, cubits, parsers); hard-coded colours or styles that
        bypass the theme; inefficient queries or rebuilds; unclear names
        or comments that no longer match the code. Items must make the
        code better without changing what the app or the collector does.
      fix_prompt: |
        Each item must make the code better without changing what the app
        or the collector does. Keep the diff easy to review; do not
        reformat files you don't otherwise change.
