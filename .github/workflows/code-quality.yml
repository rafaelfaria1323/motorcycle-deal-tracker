name: Code quality review

# Claude works on docs/code-quality.md through backlog-pass.yml: while
# "To do" has items, every 5 merged PRs it does up to 3; when "To do" is
# empty, after 10 merged PRs a run only finds new items (up to 10) and
# changes no code. "Run workflow" starts one now. Bugs and tests belong to
# test-hardening.yml, so the two passes never look for the same things. One PR labelled "code-quality" per run
# (none if nothing is worth it); no run starts while one is still open.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret and "Allow GitHub Actions to
# create and approve pull requests" in the repo settings.
on:
  workflow_dispatch: # manual "Run workflow" button: run now
  pull_request:
    types: [closed]
    branches: [main]

# One backlog pass at a time (code quality and test hardening).
concurrency:
  group: backlog-pass
  cancel-in-progress: false

jobs:
  pass:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    uses: ./.github/workflows/backlog-pass.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      backlog: docs/code-quality.md
      label: code-quality
      tag: code-quality-reviewed
      count_from: '2026-10-19T00:00:00Z'
      manual: ${{ github.event_name == 'workflow_dispatch' }}
      find_prompt: |
        Review how the code is written, in this order: duplicated code;
        dead code; code in the wrong place (logic in widgets that belongs
        in a tested *_text.dart or cubit, layers mixed up); hard-coded
        colours or styles that bypass the theme; inefficient queries or
        rebuilds; unclear names or comments that no longer match the code.
        Leave bugs, missing tests and redundant tests out: the
        test-hardening pass (docs/test-hardening.md) looks for those.
        Items must make the code better without changing what the app or
        the collector does.
      fix_prompt: |
        Each item must make the code better without changing what the app
        or the collector does. Keep the diff easy to review; do not
        reformat files you don't otherwise change.
