name: Collect listings

on:
  # Started at 00:00, 08:00 and every 2 hours from 12:00 to 20:00, Lisbon
  # time, by Supabase: the hourly pg_cron job 'collect-listings' calls
  # dispatch_collection(), which calls the workflow_dispatch API at those
  # hours (GitHub's own scheduler never started this workflow). Also the
  # manual "Run workflow" button.
  # No request caps (Rafael, 2026-10-22): each site gets robots.txt, every
  # page of the tracked models' searches and (Standvirtual) every listing
  # page still to read, 6-10 s apart, one at a time, at most 30 minutes per
  # site (FetchPolicy.maxRunTime; the rest waits for the next run). The
  # requests of each run and day are recorded and shown in the app.
  workflow_dispatch:

# Never two runs at once: they would fetch the same site in parallel.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Two sites of at most 30 minutes of requests each, plus the imports.
    timeout-minutes: 75
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Android app devices (FCM); without it they are not reached.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install collector dependencies
        run: cd collector && dart pub get

      # The fetcher's requests today and block pause live in these files (one
      # per site); each run saves a new copy and the next run restores the
      # latest.
      - name: Restore fetch state
        uses: actions/cache/restore@v6
        with:
          path: |
            collector/.fetch_state.json
            collector/.fetch_state.olx.json
          key: fetch-state-${{ github.run_id }}
          restore-keys: fetch-state-

      - name: Refresh
        id: refresh
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          set +e
          make refresh ARGS=--full 2>&1 | tee run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record the run
        if: always()
        run: >
          cd collector &&
          dart run bin/report_run.dart
          "${{ steps.refresh.outputs.code || '1' }}"
          "${{ steps.refresh.outputs.started }}"
          ../run.log

      - name: Save fetch state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            collector/.fetch_state.json
            collector/.fetch_state.olx.json
          key: fetch-state-${{ github.run_id }}

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: run.log
          retention-days: 7

      - name: Fail the job if the refresh failed
        if: steps.refresh.outputs.code != '0'
        run: exit 1