name: Collect listings

on:
  # Started at 00:00 and every 2 hours from 08:00 to 22:00, Lisbon
  # time, by Supabase: the hourly pg_cron job 'collect-listings' calls
  # dispatch_collection(), which calls the workflow_dispatch API at those
  # hours (GitHub's own scheduler never started this workflow). Also the
  # manual "Run workflow" button.
  # No request caps (Rafael, 2026-10-22): each site gets robots.txt (once a
  # day, kept in the fetch state up to 24 h), every
  # page of the tracked models' searches and (Standvirtual) every listing
  # page still to read, 6-10 s apart, one at a time, at most 30 minutes per
  # site (FetchPolicy.maxRunTime; the rest waits for the next run). The
  # requests of each run and day are recorded and shown in the app.
  # Light runs (R.2): at 00:00, 08:00, 14:00 and 20:00 every search is read
  # in full; the other runs read a search read in full in the last 12 h
  # newest first, only up to the ads published or renewed before that read
  # (bin/refresh.dart --light; such a search removes nothing).
  workflow_dispatch:
    inputs:
      read:
        description: 'auto: full at 00, 08, 14 and 20 h (Lisbon), else light'
        type: choice
        options: [auto, full, light]
        default: auto

# Never two runs at once: they would fetch the same site in parallel.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Two sites of at most 30 minutes of requests each, plus the imports,
    # and at most 5 minutes of photos.
    timeout-minutes: 85
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Android app devices (FCM); without it they are not reached.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install collector dependencies
        run: cd collector && dart pub get

      # The fetcher's requests today, block pause and robots.txt (kept up to
      # 24 h) live in these files (one per site); each run saves a new copy
      # and the next run restores the latest.
      - name: Restore fetch state
        uses: actions/cache/restore@v6
        with:
          path: |
            collector/.fetch_state.json
            collector/.fetch_state.olx.json
            collector/.fetch_state.photos.json
          key: fetch-state-${{ github.run_id }}
          restore-keys: fetch-state-

      - name: Refresh
        id: refresh
        env:
          READ: ${{ inputs.read }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          read="${READ:-auto}"
          if [ "$read" = auto ]; then
            case "$(TZ=Europe/Lisbon date +%H)" in
              00 | 08 | 14 | 20) read=full ;;
              *) read=light ;;
            esac
          fi
          args=--full
          if [ "$read" = light ]; then args="--full --light"; fi
          echo "Reading: $read"
          set +e
          make refresh ARGS="$args" 2>&1 | tee run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      # Its outputs.status: ok, partial, blocked or failed (runStatus).
      - name: Record the run
        id: record
        if: always()
        run: >
          cd collector &&
          dart run bin/report_run.dart
          "${{ steps.refresh.outputs.code || '1' }}"
          "${{ steps.refresh.outputs.started }}"
          ../run.log

      # Photo fingerprints (P.1): up to 3 photos of each new listing, from
      # OLX's photo CDN only (both sites' photos live there; no page of
      # either site), 2-3 s apart, at most 5 minutes, after the run is
      # recorded so it never delays it. The next run's scores use them.
      # Its requests are counted apart ("Photo requests:"). Never fails
      # the job: listings left over wait for the next run.
      - name: Fingerprint photos
        if: always() && steps.refresh.outputs.started != ''
        continue-on-error: true
        run: make photos

      - name: Save fetch state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            collector/.fetch_state.json
            collector/.fetch_state.olx.json
            collector/.fetch_state.photos.json
          key: fetch-state-${{ github.run_id }}

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: run.log
          retention-days: 7

      # A partial run (a site's passing fetch failure; the rest was read
      # and scored) stays green with a warning: the app shows it, and the
      # admins are told when the same site fails again in the next run.
      - name: Warn about a partial run
        if: steps.refresh.outputs.code != '0' && steps.record.outputs.status == 'partial'
        run: >
          echo "::warning title=Recolha incompleta::Uma pesquisa ou um site
          ficou por ler por uma falha passageira (ver run.log); a próxima
          recolha volta a ler."

      - name: Fail the job if the refresh failed
        if: steps.refresh.outputs.code != '0' && steps.record.outputs.status != 'partial'
        run: exit 1