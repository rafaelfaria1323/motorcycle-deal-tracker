name: Deploy web app

# On a merge to main, all at once: the database (the migrations it is
# missing, if any), the app's tests on the merged code, and the web app's
# and the Android app's builds. Only publishing waits for the migrations
# and the tests, so the app never reaches a database without the columns
# it reads; a failed migration or test publishes neither.
on:
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - '.fvmrc'
      - 'app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-web.yml'

# One at a time and never cancelled: stopping a migration halfway is worse
# than waiting (a newer merge waits for the running one).
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Cloudflare Pages project; the app is served at https://<name>.pages.dev
  # (Cloudflare adds a suffix if the name is taken; the deploy log shows it).
  PAGES_PROJECT: motorcycle-deal-tracker
  # The Android app: one GitHub release (tag `android`) whose APK each
  # deploy replaces, so this address always gives the latest (the repo is
  # public: no sign-in). Mais offers it on Android.
  APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/android/motorcycle-deal-tracker.apk

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Plain Postgres to test the migrations again before the real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a merge: refuses a change to a migration already on main, and
      # lists the ones the merge adds (only a guard: what gets applied is
      # decided below, by the database).
      - name: Check migration names
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: tool/check_migrations.sh "$BEFORE" "$GITHUB_SHA"

      # SUPABASE_DB_URL: Supabase > Connect > Session pooler connection
      # string exactly as shown, "[YOUR-PASSWORD]" included (GitHub's
      # runners have no IPv6 for the direct connection); SUPABASE_DB_PASSWORD:
      # the database password as typed. The password is URL-encoded here,
      # so any character works. (A URL with the password already in it and
      # no SUPABASE_DB_PASSWORD also works.)
      # Asks the database which migrations it is missing (dry run), not
      # which ones this merge adds: a queued deploy is replaced by a newer
      # merge's, so a merge's own run may never happen, and the next run
      # must still apply its migrations. None missing: the steps below are
      # skipped (the job still succeeds, so the app deploys).
      - name: Find missing migrations
        id: db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          db_url=$(python3 tool/db_url.py) || exit 1
          echo "::add-mask::$db_url"
          tool/apply_migrations.sh "$db_url" --dry-run

      # Every migration on an empty database, then every SQL test: the same
      # as the pull request's check, again on the merged code.
      - name: Test migrations (make db-test)
        if: steps.db.outputs.pending != '0'
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: make db-test

      # Applied with psql, not `supabase db push`: the CLI rewrites a pooler
      # URL to the direct IPv6-only host. Same history table as the CLI;
      # each migration in one transaction with its record.
      - name: Apply migrations to Supabase
        if: steps.db.outputs.pending != '0'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          db_url=$(python3 tool/db_url.py) || exit 1
          echo "::add-mask::$db_url"
          tool/apply_migrations.sh "$db_url"

  # The app's tests on the merged code (it can differ from what the pull
  # request tested when main moved), next to the migrations.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install app dependencies
        run: cd app && flutter pub get

      - name: Test
        run: cd app && flutter test

  # The web app, built beside the tests; published by `deploy`.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install app dependencies
        run: cd app && flutter pub get

      # The publishable key is meant for browsers (row-level security protects
      # the data); it is a secret only to keep it out of the repository.
      # The APK's address only once there is a signing key (the android
      # job below publishes nothing without one).
      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets"
            exit 1
          fi
          apk_url=""
          if [ "$HAS_ANDROID_KEY" = true ]; then apk_url="$APK_URL"; fi
          cd app && flutter build web --release --wasm \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=APK_URL="$apk_url"
          ../tool/web_preconnect.sh build/web/index.html "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/build/web
          retention-days: 1

  deploy:
    needs: [migrate, test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: app/build/web

      # The first deploy creates the Pages project.
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT" ||
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
              --production-branch=main
          npx --yes wrangler@4 pages deploy app/build/web \
            --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

  # The Android app, built beside the tests and signed with the key in the
  # secrets (the same key every time, or Android refuses to install an
  # update over the app); `android-release` puts it on the `android`
  # release. Skipped until ANDROID_KEYSTORE_BASE64 and
  # ANDROID_KEYSTORE_PASSWORD are set (docs/hosting.md, "Android app").
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No Android signing key (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD): no APK built"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'

      - uses: actions/setup-java@v6
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # What Gradle downloads (its own distribution, the Android plugins'
      # libraries) and its build cache, kept between deploys; a new entry
      # (starting from the latest one) only when the Flutter SDK, the
      # dependencies or the build scripts change. The NDK (about 1 GB, a
      # minute to download and unzip) by its version. Pull requests' APK
      # builds (android-check.yml) only read them.
      - name: Android cache keys
        id: android
        if: steps.key.outputs.ready == 'true'
        run: tool/android_cache_keys.sh >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: steps.key.outputs.ready == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: android-gradle-${{ steps.android.outputs.flutter }}-${{ hashFiles('app/pubspec.lock', 'app/packages/**', 'tool/android_build.sh', 'tool/android_manifest.py', 'tool/firebase_values.py') }}
          restore-keys: android-gradle-

      - uses: actions/cache@v6
        if: steps.key.outputs.ready == 'true' && steps.android.outputs.ndk != ''
        with:
          path: ${{ steps.android.outputs.ndk_path }}
          key: android-ndk-${{ steps.android.outputs.ndk }}

      # tool/android_build.sh: the Android project made from this
      # Flutter's template, then the APK; the run number is its version.
      - name: Build APK
        if: steps.key.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Where shared links point (invites, the app's link). Set the
          # variable WEB_APP_URL if Cloudflare gave the project another
          # address.
          WEB_URL: ${{ vars.WEB_APP_URL || format('https://{0}.pages.dev', env.PAGES_PROJECT) }}
          # The Firebase project's google-services.json: notifications in
          # the app (none without it).
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: tool/android_build.sh "${{ github.run_number }}"

      # The template signs releases with a throwaway debug key; apksigner
      # signs it again with ours (PKCS12, alias `upload`).
      - name: Sign APK
        if: steps.key.outputs.ready == 'true'
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias upload --ks-pass env:KEYSTORE_PASSWORD \
            --out motorcycle-deal-tracker.apk \
            app/build/app/outputs/flutter-apk/app-release.apk
          rm "$keystore"
          "$apksigner" verify --print-certs motorcycle-deal-tracker.apk

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ready == 'true'
        with:
          name: apk
          path: motorcycle-deal-tracker.apk
          retention-days: 1

  # The first deploy creates the release; later ones replace its APK and
  # android.json.
  android-release:
    needs: [migrate, test, android]
    if: needs.android.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          notes="Versão $BUILD (commit $GITHUB_SHA). Instale a app no Android a partir deste ficheiro; depois, a própria app atualiza-se em Mais › App Android."
          if gh release view android > /dev/null 2>&1; then
            gh release edit android --notes "$notes"
          else
            gh release create android --title "App Android" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android motorcycle-deal-tracker.apk --clobber
          # Then the version file the app reads to offer the update (after
          # the APK, so it never names a build that isn't there yet).
          printf '{"build": %s, "commit": "%s"}\n' "$BUILD" "$GITHUB_SHA" > android.json
          gh release upload android android.json --clobber
