name: Deploy web app

on:
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-web.yml'

# A newer merge replaces a deploy still running.
concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cloudflare Pages project; the app is served at https://<name>.pages.dev
  # (Cloudflare adds a suffix if the name is taken; the deploy log shows it).
  PAGES_PROJECT: motorcycle-deal-tracker

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install app dependencies
        run: cd app && flutter pub get

      - name: Test
        run: cd app && flutter test

      # The publishable key is meant for browsers (row-level security protects
      # the data); it is a secret only to keep it out of the repository.
      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets"
            exit 1
          }
          cd app && flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # The first deploy creates the Pages project.
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT" ||
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
              --production-branch=main
          npx --yes wrangler@4 pages deploy app/build/web \
            --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
