name: Deploy web app

# On a merge to main: first the database (new migrations, if the merge adds
# any), then the app, so the app never reaches a database without the
# columns it reads. A failed migration stops the app deploy.
on:
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-web.yml'

# One at a time and never cancelled: stopping a migration halfway is worse
# than waiting (a newer merge waits for the running one).
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Cloudflare Pages project; the app is served at https://<name>.pages.dev
  # (Cloudflare adds a suffix if the name is taken; the deploy log shows it).
  PAGES_PROJECT: motorcycle-deal-tracker

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Plain Postgres to test the migrations again before the real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Which migrations this merge adds; none: every step below is skipped
      # (the job still succeeds, so the app deploys). Also refuses a change
      # to a migration already on main. The manual "Run workflow" button
      # always checks and applies whatever the database is missing.
      - name: Find new migrations
        id: new
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            tool/check_migrations.sh "$BEFORE" "$GITHUB_SHA"
          else
            echo "count=manual" >> "$GITHUB_OUTPUT"
          fi

      # Every migration on an empty database, then every SQL test: the same
      # as the pull request's check, again on the merged code.
      - name: Test migrations (make db-test)
        if: steps.new.outputs.count != '0'
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: make db-test

      # SUPABASE_DB_URL: Supabase > Connect > Session pooler connection
      # string exactly as shown, "[YOUR-PASSWORD]" included (GitHub's
      # runners have no IPv6 for the direct connection); SUPABASE_DB_PASSWORD:
      # the database password as typed. The password is URL-encoded here,
      # so any character works. (A URL with the password already in it and
      # no SUPABASE_DB_PASSWORD also works.)
      # Applied with psql, not `supabase db push`: the CLI rewrites a pooler
      # URL to the direct IPv6-only host. Same history table as the CLI;
      # each migration in one transaction with its record. The dry run
      # lists what will run.
      - name: Apply migrations to Supabase
        if: steps.new.outputs.count != '0'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          db_url=$(python3 tool/db_url.py) || exit 1
          echo "::add-mask::$db_url"
          tool/apply_migrations.sh "$db_url" --dry-run
          tool/apply_migrations.sh "$db_url"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        run: cd app && flutter pub get

      - name: Test
        run: cd app && flutter test

      # The publishable key is meant for browsers (row-level security protects
      # the data); it is a secret only to keep it out of the repository.
      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets"
            exit 1
          }
          cd app && flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # The first deploy creates the Pages project.
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PAGES_PROJECT" ||
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
              --production-branch=main
          npx --yes wrangler@4 pages deploy app/build/web \
            --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
