name: Photos

# The photo step on its own: fingerprints of new listings' first photos
# (P.1), the image model's damage hints (P.2, P.3) and the ads someone
# asked to examine in full (P.4), first. From OLX's photo CDN only (both
# sites' photos live there; never a page of either site), 2-3 s apart, at
# most 5 minutes (bin/photos.dart). It only reads the database's queues,
# so a run with nothing waiting ends at once.
#
# Called by collect.yml after every collection, and started at once by
# the database when someone asks in the app for every photo of an ad
# ("Examinar todas as fotos": request_photo_exam -> dispatch_workflow),
# so that answer doesn't wait for the next collection. Also "Run workflow".
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    # Never two at once: the photo CDN is read one request at a time. A
    # start while one runs waits for it (a newer start replaces a waiting
    # one, which loses nothing: each run takes every request waiting).
    concurrency:
      group: photos
      cancel-in-progress: false
    # 5 minutes of photos, plus the image model's set-up.
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Android app devices (FCM), told when an examination is done.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/collector

      # The photo CDN's requests today, block pause and robots.txt. Its own
      # cache, not collect.yml's: this job may run beside a collection,
      # and must never save an older copy of the sites' state over it.
      - name: Restore the photo fetch state
        uses: actions/cache/restore@v6
        with:
          path: collector/.fetch_state.photos.json
          key: photo-state-${{ github.run_id }}
          restore-keys: photo-state-

      # The image model (P.2): CLIP ViT-B/32, free and run here on the CPU
      # (tool/photo_examine.py), downloaded once from Hugging Face and then
      # cached. Without it the photos are still fingerprinted, and the
      # hints wait.
      - name: Set up the photo model's Python
        id: photo-python
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/photo_requirements.txt

      - name: Install the photo model's dependencies
        id: photo-deps
        if: steps.photo-python.outcome == 'success'
        continue-on-error: true
        run: python -m pip install --quiet -r tool/photo_requirements.txt

      - name: Restore the photo model
        if: steps.photo-deps.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.cache/photo-model
          key: photo-model-${{ hashFiles('tool/photo_model.sh') }}

      - name: Download the photo model
        id: photo-model
        if: steps.photo-deps.outcome == 'success'
        continue-on-error: true
        run: tool/photo_model.sh ~/.cache/photo-model

      # Never fails the job (a collection stays green for it): listings
      # left over wait for the next run. Its requests are counted apart
      # ("Photo requests:").
      - name: Fingerprint and examine photos
        id: photos
        continue-on-error: true
        env:
          PHOTO_MODEL_OK: ${{ steps.photo-model.outcome }}
        run: |
          if [ "$PHOTO_MODEL_OK" = success ]; then
            export PHOTO_MODEL_DIR="$HOME/.cache/photo-model" PHOTO_PYTHON=python
          fi
          make photos

      - name: Save the photo fetch state
        if: always() && hashFiles('collector/.fetch_state.photos.json') != ''
        uses: actions/cache/save@v6
        with:
          path: collector/.fetch_state.photos.json
          key: photo-state-${{ github.run_id }}

      # A step that stops every run would otherwise go unseen.
      - name: Warn about a failed photo step
        if: always() && steps.photos.outcome == 'failure'
        run: >
          echo "::warning title=Fotos por verificar::O passo das fotos
          falhou (ver o seu registo); os anúncios esperam pela próxima
          recolha."
