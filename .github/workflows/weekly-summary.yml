name: Weekly summary

# Every Monday morning, each account's summary of its own models' last 7
# days (new listings, price drops, listings gone and the best deals now):
# kept for the app's "Resumo da semana" page and sent to the account's
# devices as a notification (Web Push) that opens it. It only reads the
# database (no site is fetched).
#
# Started on Mondays at 08:52 Lisbon time, all year, by the
# Supabase pg_cron job 'weekly-summary', like collect.yml, for every
# account. "Enviar o resumo da semana" in the app starts it with that
# account as `account` (start_workflow), for that account only; "Run
# workflow" here without an account makes everyone's, and then runs the
# description check (text-audit.yml, N.55), the score check
# (score-check.yml, N.61), the model specifications (model-specs.yml,
# N.76) and the database backup (backup.yml, N.79) beside it.
on:
  workflow_dispatch:
    inputs:
      account:
        description: Only this account (user id); empty for every account
        required: false
        type: string

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Android app devices (FCM); without it they are not reached.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SUMMARY_ACCOUNT: ${{ inputs.account }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/collector

      - name: Send the summary
        run: cd collector && dart run bin/weekly_summary.dart

  text-audit:
    # Weekly with everyone's summary, never when one account asks for its own.
    if: inputs.account == ''
    uses: ./.github/workflows/text-audit.yml
    secrets: inherit

  score-check:
    # Weekly with everyone's summary, as the description check.
    if: inputs.account == ''
    uses: ./.github/workflows/score-check.yml
    secrets: inherit

  model-specs:
    # Weekly with everyone's summary: the catalog's missing figures.
    if: inputs.account == ''
    uses: ./.github/workflows/model-specs.yml
    secrets: inherit

  backup:
    # Weekly with everyone's summary: the encrypted database backup.
    if: inputs.account == ''
    uses: ./.github/workflows/backup.yml
    secrets: inherit
