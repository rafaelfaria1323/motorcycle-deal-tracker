# Checks without AI (2026-10-20): the collector's rules, except two that
# fight this app's style: a screen catches every failure on purpose (to
# show a message rather than crash), and explicit arguments such as
# DateTime(2027, 3, 1) read better than the defaults left out. Stricter
# than the recommended set, so the analyzer (`make check`, CI) catches what
# a review would otherwise have to.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/generated/**
  language:
    # No silent dynamic: casts, inferred types and raw generics are explicit.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async mistakes
    - unawaited_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    # Type safety
    - avoid_dynamic_calls
    - always_declare_return_types
    - test_types_in_equals
    - only_throw_errors
    # Dead or pointless code
    - unnecessary_statements
    - literal_only_boolean_expressions
    - unnecessary_lambdas
    - unnecessary_parenthesis
    # Immutability
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_declarations
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    # Dart 3.11-3.13 (N.40)
    - use_declaring_parameters
    - prefer_initializing_formals
    - simplify_variable_pattern
    - async_return_with_no_await
    - no_dynamic_casts
    - no_raw_types
    - simple_directive_paths
    - unnecessary_primary_constructor_body
