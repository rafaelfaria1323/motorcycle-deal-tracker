group 'io.github.rafaelfaria1323.android_push'
version '1.0.0'

// The app's own build (made by `flutter create`) brings the Android Gradle
// plugin and the repositories.
apply plugin: 'com.android.library'

android {
    namespace 'io.github.rafaelfaria1323.android_push'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Firebase starts itself from the app's resource strings
    // (res/values/firebase.xml, written by tool/firebase_values.py), so no
    // google-services Gradle plugin is needed.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'androidx.core:core:1.13.1'
}
