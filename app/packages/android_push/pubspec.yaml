name: android_push
description: Notifications in the Android app through Firebase Cloud Messaging (Deal Tracker only).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

# Android only, no Dart code: the app calls the channel itself
# (lib/core/platform/push_stub.dart).
flutter:
  plugin:
    platforms:
      android:
        package: io.github.rafaelfaria1323.android_push
        pluginClass: AndroidPushPlugin
