<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Acompanhe o mercado de motas usadas em Portugal e encontre as melhores ofertas.">


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- "default" lets iOS colour the status bar with theme-color below, so
         it matches the app's background (the app keeps it in step with
         light/dark mode while it runs). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Tracker">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- The status bar colour. Flutter writes each app bar's status bar
         colour into this tag (the id is the one its engine uses); the script
         at the start of <body> sets it before the app loads and copies it
         to the top edge strip, which is what Safari 26+ actually uses. -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="flutterweb-theme" content="#F4F5F7">

    <title>Motorcycle Deal Tracker</title>

    <link rel="manifest" href="manifest.json">

    <!-- Connections the start needs, opened while the app downloads:
         Flutter's engine (Google's CDN), the database (the build puts its
         address in: tool/web_preconnect.sh) and the listing photos. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <!-- database-preconnect -->
    <link rel="preconnect" href="https://ireland.apollo.olxcdn.com">

    <!-- Same background before the app has loaded, so nothing flashes. -->
    <style>
      html, body { background-color: #F4F5F7; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #0F1115; } }

      /* Safari 26+ on iPhone ignores theme-color: it colours the status bar
         (and its own toolbar) from a solid position:fixed element at the top
         (and bottom) edge, and Flutter's page gave it black. These strips are
         that element: as wide as the screen, more than 10px tall, the colour
         of the app bar (top) and the tab bar (bottom), so they can't be seen
         over them, and they let taps through. iPhone/iPad only. */
      .edge-tint { display: none; }
      @supports (-webkit-touch-callout: none) {
        .edge-tint {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          /* The app leaves this much room under the tab bar in Safari
             (iosBottomInset in core/platform/home_screen_app.dart). */
          height: 12px;
          z-index: 2147483647;
          pointer-events: none;
        }
        #edge-tint-top { top: 0; }
        #edge-tint-bottom { bottom: 0; }
      }
      /* The home-screen app has no Safari toolbar to tint, and the strip
         would cover the tab bar labels. */
      @media (display-mode: standalone) {
        #edge-tint-bottom { display: none; }
      }

      /* Loading screen while the app downloads (about 3 MB): the spinner
         Startup (lib/app/startup.dart) draws next, in the same place, so
         the hand-over can't be seen. An <svg> counts as content for the
         browser (first paint), a CSS border would not. Removed on
         Flutter's first frame. Colours: the theme's primary. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #C5420F;
      }
      @media (prefers-color-scheme: dark) { #splash { color: #FF6B2E; } }
      #splash svg { width: 36px; height: 36px; animation: splash-turn 1.4s linear infinite; }
      #splash circle {
        fill: none;
        stroke: currentColor;
        stroke-width: 4;
        stroke-dasharray: 1 200;
        animation: splash-arc 1.4s ease-in-out infinite;
      }
      @keyframes splash-turn { to { transform: rotate(360deg); } }
      @keyframes splash-arc {
        0% { stroke-dasharray: 1 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 70 200; stroke-dashoffset: -25; }
        100% { stroke-dasharray: 70 200; stroke-dashoffset: -100; }
      }
    </style>
</head>
<body>
<div class="edge-tint" id="edge-tint-top"></div>
<div class="edge-tint" id="edge-tint-bottom"></div>
<div id="splash" role="progressbar" aria-label="A abrir a app">
  <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"></circle></svg>
</div>
<script>
  // The loading screen goes on Flutter's first frame (the engine's
  // flutter-first-frame event). Should that event never come, it goes
  // 10 s after the app's view exists, which draws at once.
  (function () {
    var splash = document.getElementById('splash');
    function remove() {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }
    window.addEventListener('flutter-first-frame', remove, { once: true });
    var watch = new MutationObserver(function () {
      if (!document.querySelector('flutter-view')) return;
      watch.disconnect();
      setTimeout(remove, 10000);
    });
    watch.observe(document.body, { childList: true });
  })();
</script>
<script>
  // Before the app loads: theme-color and the strips in the current
  // light/dark mode (AppTheme.lightBackground / darkBackground at the top,
  // the tab bar's surfaceContainerLowest at the bottom). Afterwards the top
  // strip follows theme-color, which Flutter sets from each app bar (the
  // photo viewer makes it black). Safari samples a strip only when it
  // appears, so a strip is put back whenever its colour changes.
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    var theme = document.getElementById('flutterweb-theme');

    var painted = {};

    function paint(id, colour) {
      if (painted[id] === colour) return;
      painted[id] = colour;
      var strip = document.getElementById(id);
      var parent = strip.parentNode;
      var next = strip.nextSibling;
      parent.removeChild(strip);
      strip.style.backgroundColor = colour;
      parent.insertBefore(strip, next);
    }

    function applyMode() {
      var background = dark.matches ? '#0F1115' : '#F4F5F7';
      theme.setAttribute('content', background);
      document.documentElement.style.backgroundColor = background;
      paint('edge-tint-bottom', dark.matches ? '#171A20' : '#FFFFFF');
    }

    applyMode();
    paint('edge-tint-top', theme.getAttribute('content'));
    dark.addEventListener('change', applyMode);
    new MutationObserver(function () {
      paint('edge-tint-top', theme.getAttribute('content'));
    }).observe(theme, { attributes: true, attributeFilter: ['content'] });
  })();
</script>
<script>
  // The first listings and the model list, asked for while the app
  // downloads instead of after it, and the first cards' photos started:
  // the largest paint of the page is the first photo. The app takes the
  // answer once (takeFirstPage, lib/core/platform/first_page_web.dart)
  // for its first page (ListingsCubit.load). Only without a session or
  // with an anonymous one, which see every collected model; an account
  // sees its own models, so its app asks itself. The queries are the
  // app's own (SupabaseListingsRepository: the default filters, Deal
  // Score order, 40 a page), checked by test/first_page_test.dart. The
  // database's address and public key: the build's
  // <meta name="database"> (tool/web_preconnect.sh); none, nothing asked.
  (function () {
    var LISTINGS = 'listings?select=id,source,url,brand,model,motorcycle_id,' +
      'duplicate_of,year,mileage,price,initial_price,price_before_drop,' +
      'deal_score,risk_score,seller_type,location,images,status,' +
      'first_seen_at,last_seen_at,distance_km,colour,my_colour,registrations,' +
      'service_book,origin,warranty_until,dealer_warranty_months,' +
      'seller_name,published_at,site_refreshed_at,market_position,' +
      'card_risk_reasons:score_breakdown->risk_reasons' +
      '&in_my_models=eq.true' +
      '&duplicate_of=is.null&status=in.(%22active%22,%22price_changed%22)' +
      '&order=deal_score.desc.nullslast,id.desc.nullslast&offset=0&limit=40';
    var MODELS = 'motorcycles?select=id,brand,model&tracked_by_me=eq.true' +
      '&order=brand.desc.nullslast,model.desc.nullslast';
    var PHOTOS = 3;
    // The cards' photo size (photoAtSize, lib/features/listings/
    // presentation/photo_url.dart; test/photo_url_test.dart).
    var PHOTO_BOX = 1280;

    var meta = document.querySelector('meta[name="database"]');
    if (!meta || !window.fetch || !window.Promise) return;
    var base = meta.getAttribute('content');
    var key = meta.getAttribute('data-key');
    try {
      // Where Supabase keeps the session in the browser.
      var stored = localStorage.getItem(
        'sb-' + new URL(base).hostname.split('.')[0] + '-auth-token');
      if (stored && !JSON.parse(stored).user.is_anonymous) return;
    } catch (e) {
      return;
    }
    var headers = { apikey: key, Authorization: 'Bearer ' + key };
    function get(query) {
      return fetch(base + '/rest/v1/' + query, { headers: headers })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        });
    }
    // The photo CDN's address at the cards' size, as photoAtSize.
    function sized(url) {
      var match = /^(https:\/\/ireland\.apollo\.olxcdn\.com(?::443)?\/v1\/files\/[^\/?#;]+\/image)((?:;[^\/?#]*)?)$/
        .exec(url);
      if (!match) return url;
      var width = PHOTO_BOX;
      var height = Math.floor(PHOTO_BOX * 3 / 4);
      var kept = [match[1]];
      var params = match[2].split(';');
      for (var i = 0; i < params.length; i++) {
        var size = /^s=(\d+)x(\d+)$/.exec(params[i]);
        if (size) {
          var w = +size[1];
          var h = +size[2];
          if (w <= PHOTO_BOX && h <= PHOTO_BOX) return url;
          var longest = Math.max(w, h);
          width = Math.round(w * PHOTO_BOX / longest);
          height = Math.round(h * PHOTO_BOX / longest);
        } else if (params[i] && params[i].indexOf('s=') !== 0) {
          kept.push(params[i]);
        }
      }
      kept.push('s=' + width + 'x' + height);
      return kept.join(';');
    }
    // Kept, so a photo isn't dropped before it arrives.
    var photos = [];
    window.dealTrackerFirstPage = Promise.all([get(LISTINGS), get(MODELS)])
      .then(function (texts) {
        JSON.parse(texts[0]).slice(0, PHOTOS).forEach(function (listing) {
          if (!listing.images || !listing.images.length) return;
          // The same address as the card's <img>, so it comes from the
          // browser's cache; low priority, the app's files go first.
          var photo = new Image();
          photo.fetchPriority = 'low';
          photo.src = sized(listing.images[0]);
          photos.push(photo);
        });
        return '{"listings":' + texts[0] + ',"motorcycles":' + texts[1] + '}';
      })
      .catch(function () {
        return null;
      });
  })();
</script>
<!-- Notifications on this device (Web Push): see push.js. -->
<script src="push.js"></script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
