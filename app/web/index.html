<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Acompanhe o mercado de motas usadas em Portugal e encontre as melhores ofertas.">


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- "default" lets iOS colour the status bar with theme-color below, so
         it matches the app's background (the app keeps it in step with
         light/dark mode while it runs). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Tracker">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- The app's background (Material surface) in light and dark mode. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF8F6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A110F">

    <title>Motorcycle Deal Tracker</title>

    <link rel="manifest" href="manifest.json">

    <!-- Same background before the app has loaded, so nothing flashes. -->
    <style>
      body { background-color: #FFF8F6; }
      @media (prefers-color-scheme: dark) { body { background-color: #1A110F; } }
    </style>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
