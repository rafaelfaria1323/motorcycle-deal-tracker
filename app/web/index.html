<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Acompanhe o mercado de motas usadas em Portugal e encontre as melhores ofertas.">


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- "default" lets iOS colour the status bar with theme-color below, so
         it matches the app's background (the app keeps it in step with
         light/dark mode while it runs). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Tracker">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- The status bar colour = the app's background (AppTheme.lightBackground
         / darkBackground). One theme-color tag only: the installed iPhone app
         ignores media="(prefers-color-scheme…)" and took the last (dark) tag.
         The script sets it for the current mode and follows mode changes. The
         id is the one Flutter's engine uses for the colour of the Title in
         MaterialApp.builder, so Flutter updates this same tag (if it ever
         adds its own, it writes the same colour). -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="flutterweb-theme" content="#F4F5F7">
    <script>
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          var colour = dark.matches ? '#0F1115' : '#F4F5F7';
          document.getElementById('flutterweb-theme').setAttribute('content', colour);
          document.documentElement.style.backgroundColor = colour;
        }
        apply();
        dark.addEventListener('change', apply);
      })();
    </script>

    <title>Motorcycle Deal Tracker</title>

    <link rel="manifest" href="manifest.json">

    <!-- Same background before the app has loaded, so nothing flashes. -->
    <style>
      html, body { background-color: #F4F5F7; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #0F1115; } }
    </style>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
