<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <!-- So the loading preview below is laid out at the phone's width;
         Flutter puts its own in its place when it starts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Acompanhe o mercado de motas usadas em Portugal e encontre as melhores ofertas.">


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- "default" lets iOS colour the status bar with theme-color below, so
         it matches the app's background (the app keeps it in step with
         light/dark mode while it runs). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Tracker">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- The status bar colour. Flutter writes each app bar's status bar
         colour into this tag (the id is the one its engine uses); the script
         at the start of <body> sets it before the app loads and copies it
         to the top edge strip, which is what Safari 26+ actually uses. -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="flutterweb-theme" content="#F4F5F7">

    <title>Motorcycle Deal Tracker</title>

    <link rel="manifest" href="manifest.json">

    <!-- Connections the start needs, opened while the app downloads:
         Flutter's engine (Google's CDN), the database (the build puts its
         address in: tool/web_preconnect.sh) and the listing photos. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <!-- database-preconnect -->
    <link rel="preconnect" href="https://ireland.apollo.olxcdn.com">

    <!-- The app's and the engine's files (about 2.7 MB) asked for now
         instead of after flutter_bootstrap.js (web/flutter_bootstrap.js) has downloaded and run (its
         browser checks, then main.dart.mjs, then main.dart.wasm: about a
         second later on a phone). The same files and the same requests
         the loader then makes, so they come from these downloads; its
         choice is copied (flutter.js in the Flutter SDK 3.50: dart2wasm
         with skwasm where the browser has the WebAssembly features
         dart2wasm needs, on the engines flutter_bootstrap.js allows (not
         Safari's), not Firefox before 147; else dart2js with CanvasKit; keep in step when
         upgrading Flutter). The
         engine's address needs its version: the build's
         <meta name="flutter-engine"> (tool/web_preconnect.sh); none (a
         debug run), nothing asked. -->
    <script>
      (function () {
        var meta = document.querySelector('meta[name="flutter-engine"]');
        if (!meta || !window.WebAssembly) return;
        var engine = 'https://www.gstatic.com/flutter-canvaskit/' +
          meta.getAttribute('content') + '/';
        var blink = navigator.vendor === 'Google Inc.' ||
          navigator.userAgent.indexOf('Edg/') >= 0;
        var firefox = navigator.vendor === '' &&
          navigator.userAgent.indexOf('Firefox') >= 0;
        var firefoxVersion = navigator.userAgent.match(/firefox\/(\d+)/i);
        // flutter.js's webkit: every browser on the iPhone, and Safari.
        var webkit = navigator.vendor === 'Apple Computer, Inc.';
        // supports_dart2wasm.js: WasmGC, SIMD, js-string builtins, try_table.
        var dart2wasm = false;
        try {
          var valid = function (bytes, options) {
            return WebAssembly.validate(new Uint8Array(bytes), options);
          };
          dart2wasm =
            valid([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]) &&
            valid([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3,
              2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]) &&
            !valid([0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 2, 23,
              1, 14, 119, 97, 115, 109, 58, 106, 115, 45, 115, 116, 114,
              105, 110, 103, 4, 99, 97, 115, 116, 0, 0],
              { builtins: ['js-string'] }) &&
            valid([0, 97, 115, 109, 1, 0, 0, 0, 1, 4, 1, 96, 0, 0, 3, 2, 1,
              0, 10, 13, 1, 11, 0, 2, 64, 31, 64, 1, 2, 0, 11, 11, 11]);
        } catch (e) {}
        // Firefox before 147 miscompiles dart2wasm (flutter#186619).
        if (firefox && (firefoxVersion ? +firefoxVersion[1] : -1) < 147) {
          dart2wasm = false;
        }
        // flutter_bootstrap.js leaves webkit out of wasmAllowList (N.91).
        if (webkit) dart2wasm = false;
        var codecs = blink && typeof ImageDecoder !== 'undefined';
        var breaks = typeof Intl.v8BreakIterator !== 'undefined' &&
          typeof Intl.Segmenter !== 'undefined';
        // rel, address, as, cross-origin.
        function preload(rel, href, as, cors) {
          var link = document.createElement('link');
          link.rel = rel;
          link.href = new URL(href, document.baseURI).toString();
          if (as) link.as = as;
          if (cors) link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
        if (dart2wasm) {
          var skwasm = codecs && breaks ? 'skwasm' : 'skwasm_heavy';
          preload('modulepreload', 'main.dart.mjs');
          preload('preload', 'main.dart.wasm', 'fetch', true);
          preload('modulepreload', engine + skwasm + '.js');
          preload('preload', engine + skwasm + '.wasm', 'fetch', true);
        } else {
          var canvasKit = engine + (codecs && breaks ? 'chromium/' : '');
          preload('preload', 'main.dart.js', 'script');
          preload('modulepreload', canvasKit + 'canvaskit.js');
          preload('preload', canvasKit + 'canvaskit.wasm', 'fetch', true);
        }
      })();
    </script>

    <!-- Same background before the app has loaded, so nothing flashes. -->
    <style>
      html, body { background-color: #F4F5F7; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #0F1115; } }

      /* Safari 26+ on iPhone ignores theme-color: it colours the status bar
         (and its own toolbar) from a solid position:fixed element at the top
         (and bottom) edge, and Flutter's page gave it black. These strips are
         that element: as wide as the screen, more than 10px tall, the colour
         of the app bar (top) and the tab bar (bottom), so they can't be seen
         over them, and they let taps through. iPhone/iPad only. */
      .edge-tint { display: none; }
      @supports (-webkit-touch-callout: none) {
        .edge-tint {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          /* The app leaves this much room under the tab bar in Safari
             (iosBottomInset in core/platform/home_screen_app.dart). */
          height: 12px;
          z-index: 2147483647;
          pointer-events: none;
        }
        #edge-tint-top { top: 0; }
        #edge-tint-bottom { bottom: 0; }
      }
      /* The home-screen app has no Safari toolbar to tint, and the strip
         would cover the tab bar labels. */
      @media (display-mode: standalone) {
        #edge-tint-bottom { display: none; }
      }

      /* Loading screen while the app downloads (about 3 MB): the spinner
         Startup (lib/app/startup.dart) draws next, in the same place, so
         the hand-over can't be seen. An <svg> counts as content for the
         browser (first paint), a CSS border would not. Removed on
         Flutter's first frame. Colours: the theme's primary. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #C5420F;
      }
      @media (prefers-color-scheme: dark) { #splash { color: #FF6B2E; } }
      #splash svg { width: 36px; height: 36px; animation: splash-turn 1.4s linear infinite; }
      #splash circle {
        fill: none;
        stroke: currentColor;
        stroke-width: 4;
        stroke-dasharray: 1 200;
        animation: splash-arc 1.4s ease-in-out infinite;
      }
      /* While the first listings are known: the spinner in a disc over
         the first cards (#preview, drawn by the first-page script). */
      #splash.previewing svg {
        position: relative;
        z-index: 1;
        padding: 10px;
        border-radius: 50%;
        background: #FFFFFF;
        border: 1px solid #E1E4E9;
      }
      #preview {
        position: absolute;
        inset: 0;
        overflow: hidden;
        padding: 16px 20px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #14181E;
      }
      .preview-card {
        max-width: 600px;
        margin: 0 auto 16px;
        border: 1px solid #E1E4E9;
        border-radius: 12px;
        background: #FFFFFF;
        overflow: hidden;
      }
      .preview-card img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #EDEFF2;
      }
      .preview-card div { padding: 12px 16px 14px; }
      .preview-card b { display: block; font-size: 18px; }
      .preview-card span { display: block; margin-top: 2px; font-size: 14px; color: #5A626D; }
      .preview-card strong { display: block; margin-top: 8px; font-size: 22px; font-variant-numeric: tabular-nums; }
      @media (prefers-color-scheme: dark) {
        #splash.previewing svg { background: #171A20; border-color: #272C34; }
        #preview { color: #ECEEF1; }
        .preview-card { background: #171A20; border-color: #272C34; }
        .preview-card img { background: #1C2027; }
        .preview-card span { color: #9AA3AE; }
      }
      @keyframes splash-turn { to { transform: rotate(360deg); } }
      @keyframes splash-arc {
        0% { stroke-dasharray: 1 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 70 200; stroke-dashoffset: -25; }
        100% { stroke-dasharray: 70 200; stroke-dashoffset: -100; }
      }
    </style>
</head>
<body>
<div class="edge-tint" id="edge-tint-top"></div>
<div class="edge-tint" id="edge-tint-bottom"></div>
<div id="splash" role="progressbar" aria-label="A abrir a app">
  <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"></circle></svg>
</div>
<script>
  // The loading screen goes on Flutter's first frame (the engine's
  // flutter-first-frame event). Should that event never come, it goes
  // 10 s after the app's view exists, which draws at once.
  (function () {
    var splash = document.getElementById('splash');
    function remove() {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }
    window.addEventListener('flutter-first-frame', remove, { once: true });
    var watch = new MutationObserver(function () {
      if (!document.querySelector('flutter-view')) return;
      watch.disconnect();
      setTimeout(remove, 10000);
    });
    watch.observe(document.body, { childList: true });
  })();
</script>
<script>
  // Before the app loads: theme-color and the strips in the current
  // light/dark mode (AppTheme.lightBackground / darkBackground at the top,
  // the tab bar's surfaceContainerLowest at the bottom). Afterwards the top
  // strip follows theme-color, which Flutter sets from each app bar (the
  // photo viewer makes it black). Safari samples a strip only when it
  // appears, so a strip is put back whenever its colour changes.
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    var theme = document.getElementById('flutterweb-theme');

    var painted = {};

    function paint(id, colour) {
      if (painted[id] === colour) return;
      painted[id] = colour;
      var strip = document.getElementById(id);
      var parent = strip.parentNode;
      var next = strip.nextSibling;
      parent.removeChild(strip);
      strip.style.backgroundColor = colour;
      parent.insertBefore(strip, next);
    }

    function applyMode() {
      var background = dark.matches ? '#0F1115' : '#F4F5F7';
      theme.setAttribute('content', background);
      document.documentElement.style.backgroundColor = background;
      paint('edge-tint-bottom', dark.matches ? '#171A20' : '#FFFFFF');
    }

    applyMode();
    paint('edge-tint-top', theme.getAttribute('content'));
    dark.addEventListener('change', applyMode);
    new MutationObserver(function () {
      paint('edge-tint-top', theme.getAttribute('content'));
    }).observe(theme, { attributes: true, attributeFilter: ['content'] });
  })();
</script>
<script>
  // The first listings and the model list, asked for while the app
  // downloads instead of after it, and the first cards' photos started:
  // the largest paint of the page is the first photo. On a phone the
  // first cards are also drawn here, under the spinner (preview, N.99),
  // so the photo shows long before Flutter's first frame, which removes
  // them with the splash. The app takes the
  // answer once (takeFirstPage, lib/core/platform/first_page_web.dart)
  // for its first page (ListingsCubit.load). Only without a session or
  // with an anonymous one, which see every collected model; an account
  // sees its own models, so its app asks itself. The queries are the
  // app's own (SupabaseListingsRepository: the default filters, Deal
  // Score order, 40 a page), checked by test/first_page_test.dart. The
  // database's address and public key: the build's
  // <meta name="database"> (tool/web_preconnect.sh); none, nothing asked.
  (function () {
    var LISTINGS = 'listings?select=id,source,url,brand,model,motorcycle_id,' +
      'duplicate_of,year,mileage,price,initial_price,price_before_drop,' +
      'deal_score,risk_score,seller_type,location,images,status,' +
      'first_seen_at,last_seen_at,distance_km,colour,my_colour,registrations,' +
      'service_book,origin,warranty_until,dealer_warranty_months,' +
      'seller_name,published_at,site_refreshed_at,market_position,' +
      'card_risk_reasons:score_breakdown->risk_reasons' +
      '&in_my_models=eq.true' +
      '&duplicate_of=is.null&status=in.(%22active%22,%22price_changed%22)' +
      '&order=deal_score.desc.nullslast,id.desc.nullslast&offset=0&limit=40';
    var MODELS = 'motorcycles?select=id,brand,model&tracked_by_me=eq.true' +
      '&order=brand.desc.nullslast,model.desc.nullslast';
    var PHOTOS = 3;
    // The cards' photo size, as cardPhotoBox (lib/features/listings/
    // presentation/photo_url.dart; test/photo_url_test.dart): the card's
    // width in real pixels, up to the next step.
    var PHOTO_STEPS = [480, 720, 960, 1280];
    var CARD_MARGIN = 40;
    var CARD_MAX_WIDTH = 600;
    function cardPhotoBox(screenWidth, pixelRatio) {
      var width = Math.min(Math.max(screenWidth - CARD_MARGIN, 0),
        CARD_MAX_WIDTH);
      var needed = width * pixelRatio;
      for (var i = 0; i < PHOTO_STEPS.length; i++) {
        if (PHOTO_STEPS[i] >= needed) return PHOTO_STEPS[i];
      }
      return PHOTO_STEPS[PHOTO_STEPS.length - 1];
    }
    // The screen's width is the one the app will have (innerWidth too,
    // with the viewport tag; the smaller in case a browser ignores it).
    var PHOTO_BOX = cardPhotoBox(
      Math.min(window.innerWidth, window.screen.width || window.innerWidth),
      window.devicePixelRatio || 1);

    var meta = document.querySelector('meta[name="database"]');
    if (!meta || !window.fetch || !window.Promise) return;
    var base = meta.getAttribute('content');
    var key = meta.getAttribute('data-key');
    // Without a session, or an anonymous one, the database answers with
    // the public key (every collected model). An account's own list needs
    // its token: only while it has more than two minutes left, since the
    // app refreshes an older one itself and a second refresh here could
    // race it (the refresh token is used once). The app takes the answer
    // only for the account it starts with (`user`).
    var token = key;
    var user = null;
    try {
      // Where Supabase keeps the session in the browser.
      var stored = localStorage.getItem(
        'sb-' + new URL(base).hostname.split('.')[0] + '-auth-token');
      var session = stored && JSON.parse(stored);
      if (session && !session.user.is_anonymous) {
        if (!(session.expires_at * 1000 > Date.now() + 120000)) return;
        token = session.access_token;
        user = session.user.id;
        if (typeof token !== 'string' || typeof user !== 'string') return;
      }
    } catch (e) {
      return;
    }
    var headers = { apikey: key, Authorization: 'Bearer ' + token };
    function get(query) {
      return fetch(base + '/rest/v1/' + query, { headers: headers })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        });
    }
    // The photo CDN's address at the cards' size, as photoAtSize.
    function sized(url) {
      var match = /^(https:\/\/ireland\.apollo\.olxcdn\.com(?::443)?\/v1\/files\/[^\/?#;]+\/image)((?:;[^\/?#]*)?)$/
        .exec(url);
      if (!match) return url;
      var width = PHOTO_BOX;
      var height = Math.floor(PHOTO_BOX * 3 / 4);
      var kept = [match[1]];
      var params = match[2].split(';');
      for (var i = 0; i < params.length; i++) {
        var size = /^s=(\d+)x(\d+)$/.exec(params[i]);
        if (size) {
          var w = +size[1];
          var h = +size[2];
          if (w <= PHOTO_BOX && h <= PHOTO_BOX) return url;
          var longest = Math.max(w, h);
          width = Math.round(w * PHOTO_BOX / longest);
          height = Math.round(h * PHOTO_BOX / longest);
        } else if (params[i] && params[i].indexOf('s=') !== 0) {
          kept.push(params[i]);
        }
      }
      kept.push('s=' + width + 'x' + height);
      return kept.join(';');
    }
    // Numbers as the app's Formatters (pt-PT: a space between thousands).
    function grouped(value) {
      return String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    }
    // Below the app's "1 €" / "consultar" prices (minRealPrice): no price.
    var MIN_REAL_PRICE = 300;
    // Phones only: one column, as the app's list there (wider screens
    // load fast and lay the cards out in a grid).
    var PREVIEW_MAX_WIDTH = 840;
    // The first cards, drawn at once under the spinner while the app
    // downloads (the slow part on a phone); they go with the spinner on
    // Flutter's first frame. Only figures and names: nothing to translate.
    function preview(listings) {
      var splash = document.getElementById('splash');
      if (!splash || !splash.parentNode) return;
      if (window.innerWidth >= PREVIEW_MAX_WIDTH) return;
      var box = document.createElement('div');
      box.id = 'preview';
      box.setAttribute('aria-hidden', 'true');
      listings.forEach(function (listing) {
        var card = document.createElement('div');
        card.className = 'preview-card';
        var photo = photos[listing.id];
        if (photo) {
          photo.alt = '';
          card.appendChild(photo);
        }
        var text = document.createElement('div');
        var name = document.createElement('b');
        name.textContent = listing.brand + ' ' + listing.model;
        text.appendChild(name);
        var facts = [];
        if (listing.year) facts.push(String(listing.year));
        if (listing.mileage != null) facts.push(grouped(listing.mileage) + ' km');
        if (facts.length) {
          var line = document.createElement('span');
          line.textContent = facts.join(' · ');
          text.appendChild(line);
        }
        if (listing.price >= MIN_REAL_PRICE) {
          var price = document.createElement('strong');
          price.textContent = grouped(listing.price) + '\u00a0€';
          text.appendChild(price);
        }
        card.appendChild(text);
        box.appendChild(card);
      });
      splash.appendChild(box);
      splash.className = 'previewing';
    }
    // Kept, so a photo isn't dropped before it arrives.
    var photos = {};
    window.dealTrackerFirstPage = Promise.all([get(LISTINGS), get(MODELS)])
      .then(function (texts) {
        var first = JSON.parse(texts[0]).slice(0, PHOTOS);
        first.forEach(function (listing, index) {
          if (!listing.images || !listing.images.length) return;
          // The same address as the card's <img>, so it comes from the
          // browser's cache. The first one at once (the preview shows
          // it); the rest after the app's files.
          var photo = new Image();
          if (index > 0) photo.fetchPriority = 'low';
          photo.src = sized(listing.images[0]);
          photos[listing.id] = photo;
        });
        try {
          preview(first);
        } catch (e) {
          // Only a preview: the app draws the list itself.
        }
        return '{"user":' + JSON.stringify(user) + ',"listings":' + texts[0] +
          ',"motorcycles":' + texts[1] + '}';
      })
      .catch(function () {
        return null;
      });
  })();
</script>
<!-- Notifications on this device (Web Push): see push.js. -->
<script src="push.js"></script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
