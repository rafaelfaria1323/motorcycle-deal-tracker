<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description"
          content="Acompanhe o mercado de motas usadas em Portugal e encontre as melhores ofertas.">


    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- "default" lets iOS colour the status bar with theme-color below, so
         it matches the app's background (the app keeps it in step with
         light/dark mode while it runs). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Deal Tracker">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <!-- The status bar colour. Flutter writes each app bar's status bar
         colour into this tag (the id is the one its engine uses); the script
         at the start of <body> sets it before the app loads and copies it
         to the top edge strip, which is what Safari 26+ actually uses. -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="flutterweb-theme" content="#F4F5F7">

    <title>Motorcycle Deal Tracker</title>

    <link rel="manifest" href="manifest.json">

    <!-- Connections the start needs, opened while the app downloads:
         Flutter's engine (Google's CDN), the database (the build puts its
         address in: tool/web_preconnect.sh) and the listing photos. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <!-- database-preconnect -->
    <link rel="preconnect" href="https://ireland.apollo.olxcdn.com">

    <!-- Same background before the app has loaded, so nothing flashes. -->
    <style>
      html, body { background-color: #F4F5F7; }
      @media (prefers-color-scheme: dark) { html, body { background-color: #0F1115; } }

      /* Safari 26+ on iPhone ignores theme-color: it colours the status bar
         (and its own toolbar) from a solid position:fixed element at the top
         (and bottom) edge, and Flutter's page gave it black. These strips are
         that element: as wide as the screen, more than 10px tall, the colour
         of the app bar (top) and the tab bar (bottom), so they can't be seen
         over them, and they let taps through. iPhone/iPad only. */
      .edge-tint { display: none; }
      @supports (-webkit-touch-callout: none) {
        .edge-tint {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          /* The app leaves this much room under the tab bar in Safari
             (iosBottomInset in core/platform/home_screen_app.dart). */
          height: 12px;
          z-index: 2147483647;
          pointer-events: none;
        }
        #edge-tint-top { top: 0; }
        #edge-tint-bottom { bottom: 0; }
      }
      /* The home-screen app has no Safari toolbar to tint, and the strip
         would cover the tab bar labels. */
      @media (display-mode: standalone) {
        #edge-tint-bottom { display: none; }
      }

      /* Loading screen while the app downloads (about 3 MB): the spinner
         Startup (lib/app/startup.dart) draws next, in the same place, so
         the hand-over can't be seen. An <svg> counts as content for the
         browser (first paint), a CSS border would not. Removed on
         Flutter's first frame. Colours: the theme's primary. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #C5420F;
      }
      @media (prefers-color-scheme: dark) { #splash { color: #FF6B2E; } }
      #splash svg { width: 36px; height: 36px; animation: splash-turn 1.4s linear infinite; }
      #splash circle {
        fill: none;
        stroke: currentColor;
        stroke-width: 4;
        stroke-dasharray: 1 200;
        animation: splash-arc 1.4s ease-in-out infinite;
      }
      @keyframes splash-turn { to { transform: rotate(360deg); } }
      @keyframes splash-arc {
        0% { stroke-dasharray: 1 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 70 200; stroke-dashoffset: -25; }
        100% { stroke-dasharray: 70 200; stroke-dashoffset: -100; }
      }
    </style>
</head>
<body>
<div class="edge-tint" id="edge-tint-top"></div>
<div class="edge-tint" id="edge-tint-bottom"></div>
<div id="splash" role="progressbar" aria-label="A abrir a app">
  <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16"></circle></svg>
</div>
<script>
  // The loading screen goes on Flutter's first frame (the engine's
  // flutter-first-frame event). Should that event never come, it goes
  // 10 s after the app's view exists, which draws at once.
  (function () {
    var splash = document.getElementById('splash');
    function remove() {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }
    window.addEventListener('flutter-first-frame', remove, { once: true });
    var watch = new MutationObserver(function () {
      if (!document.querySelector('flutter-view')) return;
      watch.disconnect();
      setTimeout(remove, 10000);
    });
    watch.observe(document.body, { childList: true });
  })();
</script>
<script>
  // Before the app loads: theme-color and the strips in the current
  // light/dark mode (AppTheme.lightBackground / darkBackground at the top,
  // the tab bar's surfaceContainerLowest at the bottom). Afterwards the top
  // strip follows theme-color, which Flutter sets from each app bar (the
  // photo viewer makes it black). Safari samples a strip only when it
  // appears, so a strip is put back whenever its colour changes.
  (function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)');
    var theme = document.getElementById('flutterweb-theme');

    var painted = {};

    function paint(id, colour) {
      if (painted[id] === colour) return;
      painted[id] = colour;
      var strip = document.getElementById(id);
      var parent = strip.parentNode;
      var next = strip.nextSibling;
      parent.removeChild(strip);
      strip.style.backgroundColor = colour;
      parent.insertBefore(strip, next);
    }

    function applyMode() {
      var background = dark.matches ? '#0F1115' : '#F4F5F7';
      theme.setAttribute('content', background);
      document.documentElement.style.backgroundColor = background;
      paint('edge-tint-bottom', dark.matches ? '#171A20' : '#FFFFFF');
    }

    applyMode();
    paint('edge-tint-top', theme.getAttribute('content'));
    dark.addEventListener('change', applyMode);
    new MutationObserver(function () {
      paint('edge-tint-top', theme.getAttribute('content'));
    }).observe(theme, { attributes: true, attributeFilter: ['content'] });
  })();
</script>
<!-- Notifications on this device (Web Push): see push.js. -->
<script src="push.js"></script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
