# Checks without AI (2026-10-20): stricter than the recommended set, so the
# analyzer (`make check`, CI) catches what a review would otherwise have to.
include: package:lints/recommended.yaml

analyzer:
  language:
    # No silent dynamic: casts, inferred types and raw generics are explicit.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async mistakes
    - unawaited_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    # Type safety
    - avoid_dynamic_calls
    - always_declare_return_types
    - test_types_in_equals
    - only_throw_errors
    - avoid_catches_without_on_clauses
    # Dead or pointless code
    - unnecessary_statements
    - literal_only_boolean_expressions
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - avoid_redundant_argument_values
    # Immutability
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_declarations
    # Dart 3.11-3.13 (N.40)
    - use_declaring_parameters
    - prefer_initializing_formals
    - simplify_variable_pattern
    - async_return_with_no_await
    - no_dynamic_casts
    - no_raw_types
    - simple_directive_paths
